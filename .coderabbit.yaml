# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# 実装 PR（統合ブランチ feat/issue-NNN 等を base とする PR）にも自動レビューを効かせる。
# 既定では base が既定ブランチ以外の PR は自動レビューがスキップされ、
# stacked PR 運用の ai-boss では実装 PR がレビューを一度も受けていなかった（#249）。
language: ja-JP
reviews:
  profile: chill
  auto_review:
    enabled: true
    # 既定ブランチに加え、すべての base ブランチを自動レビュー対象にする
    base_branches:
      - ".*"
