[package]
name = "ai-boss-tauri-app"
version = "0.1.0"
edition = "2021"
publish = false
description = "ai-boss 製品版の Tauri 2（macOS）の器（機能仕様 docs/features/tauri-in-app-runtime.md S2）"

# 仮定 A4（機能仕様 S2）: `native/secure-transport/` と同じく独立したクレート
# として置く（Cargo ワークスペースにしない）。#581 S3 で通信層を配線すると
# きは path 依存で足せる。

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# プラグインと権限は、使うスライスがそのとき最小の単位で足す（機能仕様
# docs/features/tauri-in-app-runtime.md S2「器の構成」）。
tauri = { version = "2.12", features = [] }
# #580 S2（docs/features/async-db-layer.md「S2 の設計」）: plugin-sql の
# リポジトリ内 fork（接続 1 本）。crates.io の tauri-plugin-sql は使わない。
tauri-plugin-sql = { path = "../tauri-plugin-sql", features = ["sqlite"] }
# `tauri.conf.json` に `plugins`（plugin-sql の preload）を置くと、
# `generate_context!` の展開が `serde_json` をクレートの依存として参照する。
serde_json = "1"
# #581 S3（docs/features/secure-transport-byok.md クリティカル設計決定 8）:
# 秘密情報を扱う通信層（Tauri 非依存のライブラリ）をコマンドで公開する。
secure-transport = { path = "../secure-transport" }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
# #579 S4（docs/features/tauri-in-app-runtime.md「S4 の設計」・仮定 A9）: 証跡ファイルの
# 保存。fork せず上流のまま使う。権限は `capabilities/default.json` で保存先の直下
# （`$APPCONFIG/evidence/*`）に限った 4 つだけを足す。
tauri-plugin-fs = "~2.6"

[dev-dependencies]
# #580 S2: 結合テスト（tests/sql_plugin.rs）と IPC の中継（examples/
# sql-ipc-bridge.rs）が MockRuntime の上で器を組むため、`test` 機能は
# dev-dependencies でだけ有効にする（製品のバイナリには入らない。仮定 A8）。
tauri = { version = "2.12", features = ["test"] }
tempfile = "3"
# #579 S4: IPC の中継（examples/sql-ipc-bridge.rs）が raw の本文・応答を JSON の行に載せる。
base64 = "0.22"
# 設定の検査テスト（tauri.conf.json・capabilities/・Cargo.toml の読み込み）用。
toml = "0.8"
# #581 S3: コマンドのテストの模擬 HTTP サーバー（tests/support/）。
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
