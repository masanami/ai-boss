[package]
name = "ai-boss-tauri-app"
version = "0.1.0"
edition = "2021"
# 依存（tauri・tray-icon・各プラグイン）が要求する最小の版。自前のコードが使う
# `File::try_lock`・`std::fs::TryLockError`（多重起動の錠。#659）は 1.89 で安定化した。
rust-version = "1.90"
publish = false
description = "ai-boss 製品版の Tauri 2（macOS）の器（機能仕様 docs/features/tauri-in-app-runtime.md S2）"

# 仮定 A4（機能仕様 S2）: `native/secure-transport/` と同じく独立したクレート
# として置く（Cargo ワークスペースにしない）。#581 S3 で通信層を配線すると
# きは path 依存で足せる。

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# プラグインと権限は、使うスライスがそのとき最小の単位で足す（機能仕様
# docs/features/tauri-in-app-runtime.md S2「器の構成」）。
# #579 S3（docs/features/tauri-in-app-runtime.md「S3 の設計」）: メニューバー
# 常駐のトレイ（`tray-icon`）。
tauri = { version = "2.12", features = ["tray-icon"] }
# #580 S2（docs/features/async-db-layer.md「S2 の設計」）: plugin-sql の
# リポジトリ内 fork（接続 1 本）。crates.io の tauri-plugin-sql は使わない。
tauri-plugin-sql = { path = "../tauri-plugin-sql", features = ["sqlite"] }
# `tauri.conf.json` に `plugins`（plugin-sql の preload）を置くと、
# `generate_context!` の展開が `serde_json` をクレートの依存として参照する。
serde_json = "1"
# #581 S3（docs/features/secure-transport-byok.md クリティカル設計決定 8）:
# 秘密情報を扱う通信層（Tauri 非依存のライブラリ）をコマンドで公開する。
secure-transport = { path = "../secure-transport" }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
# #579 S4（docs/features/tauri-in-app-runtime.md「S4 の設計」・仮定 A9）: 証跡ファイルの
# 保存。fork せず上流のまま使う。権限は `capabilities/default.json` で保存先の直下
# （`$APPCONFIG/evidence/*`）に限った 4 つだけを足す。
tauri-plugin-fs = "~2.6"
# #579 S3: 通知の送信（`plugin:notification|notify`）。2.5.0 の実測（デスクトップは
# 表示の結果を捨てる・許可を問い合わせない）に拠る（仮定 S3-A6）。JS のパッケージ
# （`@tauri-apps/plugin-notification`）は入れない。
# #585 S3（docs/features/scheduled-nudges.md 決定 6・「通知プラグインの fork」）:
# 2.5.0 のリポジトリ内 fork（iOS の予約時刻を UTC で読む・`add` の失敗を拒否で返す。
# 差分は native/tauri-plugin-notification/FORK.md）。crates.io の版は使わない。
tauri-plugin-notification = { path = "../tauri-plugin-notification" }

# #669 S1（docs/features/ios-shell.md 決定 1）: デスクトップのターゲットだけの依存
# （モバイルの single-instance には `init` が無い）。`tauri` の `tray-icon` 機能は、
# モバイルでは何もしないため共通の依存に付けたままにする（版の指定を 2 か所にしない）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# #659: 多重起動の防止。2 つ目の起動は既にあるプロセスへ知らせて終わる（macOS は
# `/tmp` の Unix ソケット）。WebView のコマンドを持たないため capability は変わらない。
# 2.5.1 の macOS の実装を読んで組んだため `~2.5` に固定する（3 系は alpha）。
tauri-plugin-single-instance = "~2.5"

# #681（docs/features/ios-shell.md 仮定 A12）: iOS でアプリのデータのディレクトリに
# `NSURLIsExcludedFromBackupKey` を付ける。どちらも tauri（tao・wry）が Apple の
# ターゲットで既に依存している版で、新しい crate は Cargo.lock に増えない。macOS でも
# コンパイルし、ホストの単体テストが実際に属性が付くことを確かめる（製品で呼ぶのは iOS だけ）。
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSValue", "NSError"] }

[target.'cfg(target_vendor = "apple")'.dev-dependencies]
# #681: 単体テストが属性（`com.apple.metadata:com_apple_backup_excludeItem`）を
# `getxattr` で直接読む（macOS の `isExcludedFromBackup` は、除外された祖先の配下では
# 自分に属性が無くても真を返す〔実測: シミュレータのデータコンテナ〕。付けた先そのものを見る）。
libc = "0.2"

[dev-dependencies]
# #580 S2: 結合テスト（tests/sql_plugin.rs）と IPC の中継（examples/
# sql-ipc-bridge.rs）が MockRuntime の上で器を組むため、`test` 機能は
# dev-dependencies でだけ有効にする（製品のバイナリには入らない。仮定 A8）。
tauri = { version = "2.12", features = ["test"] }
tempfile = "3"
# #579 S4: IPC の中継（examples/sql-ipc-bridge.rs）が raw の本文・応答を JSON の行に載せる。
base64 = "0.22"
# 設定の検査テスト（tauri.conf.json・capabilities/・Cargo.toml の読み込み）用。
toml = "0.8"
# #581 S3: コマンドのテストの模擬 HTTP サーバー（tests/support/）。
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
